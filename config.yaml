# Configuration file for Multi-Disease Prediction System

# Project Information
project:
  name: "Explainable AI for Multi-Disease Prediction"
  version: "1.0.0"
  author: "B.Tech Final Year Project"
  date: "January 2026"

# Directories
directories:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models: "models"
  results: "results"
  logs: "logs"
  reports: "documentation/reports"

