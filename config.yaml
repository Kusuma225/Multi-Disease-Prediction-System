# Model Configuration
models:
  algorithms:
    - logistic_regression
    - random_forest
    - xgboost
    - svm
    - neural_network
    - lightgbm
  
  hyperparameters:
    logistic_regression:
      C: [0.001, 0.01, 0.1, 1, 10, 100, 1000]  # MAX: Extended range
      penalty: ['l2']
      solver: ['lbfgs']
      max_iter: 5000
      random_state: 42
    
    random_forest:
      n_estimators: [100, 200, 300]  # MAX: Larger ensembles
      max_depth: [10, 20, 30, 50]
      min_samples_split: [2, 5]
      min_samples_leaf: [1, 2]
      max_features: ['sqrt', 'log2']
      random_state: 42
    
    xgboost:
      n_estimators: [100, 200, 300]  # MAX
      max_depth: [3, 5, 7, 9]
      learning_rate: [0.005, 0.01, 0.05, 0.1]
      subsample: [0.7, 0.8, 1.0]
      colsample_bytree: [0.7, 0.8, 1.0]
      min_child_weight: [1, 3]
      random_state: 42
    
    svm:
      C: [0.1, 1, 10, 100]  # MAX: balanced range
      kernel: ['rbf', 'linear']
      gamma: ['scale', 'auto']
      random_state: 42
    
    neural_network:
      hidden_layers: [[128, 64], [256, 128, 64], [128, 64, 32]]  # MAX: deeper nets
      activation: ['relu', 'tanh']
      learning_rate: [0.0001, 0.001, 0.01]
      optimizer: ['adam']
      epochs: 200
      batch_size: 32
      random_state: 42
      n_jobs: 1
    
    # LightGBM - MAX PERFORMANCE
    lightgbm:
      n_estimators: [100, 200, 300]
      max_depth: [5, 7, 10, -1]
      learning_rate: [0.01, 0.05, 0.1]
      num_leaves: [31, 63, 127]
      min_child_samples: [10, 20, 30]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.8, 1.0]
      random_state: 42

# Preprocessing Configuration
preprocessing:
  test_size: 0.2
  validation_size: 0.1
  cv_folds: 5   # 5-fold CV (RandomizedSearchCV n_iter=40 → 200 fits per model, research-quality)
  random_state: 42
  
  missing_value_strategy:
    numeric: "median"
    categorical: "mode"
  
  scaling_method: "standard"  # standard, minmax, robust
  
  feature_selection:
    method: "all"  # all, correlation, importance, recursive
    correlation_threshold: 0.95
    importance_threshold: 0.01
  
  imbalance_handling:
    method: "smote"  # smote, random_oversample, random_undersample, none
    sampling_strategy: "auto"

# Evaluation Metrics
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
  
  primary_metric: "roc_auc"

# Explainability Configuration
explainability:
  shap:
    enabled: true
    plot_types:
      - summary
      - waterfall
      - force
      - dependence
  
  lime:
    enabled: true
    num_features: 10
    num_samples: 5000

# Risk Classification Thresholds
risk_thresholds:
  low: [0.0, 0.3]
  medium: [0.3, 0.7]
  high: [0.7, 1.0]

# UI Configuration
ui:
  theme: "light"
  title: "Multi-Disease Prediction System"
  sidebar_state: "expanded"
  
# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/system.log"

# Random Seeds (for reproducibility)
random_seeds:
  global: 42
  numpy: 42
  tensorflow: 42
